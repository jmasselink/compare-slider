<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Sentinel-2 Imagery Comparison</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js" integrity="sha256-u7e5khyithlIdTpu22PHhENmPcRdFiHRjhAuHcs05RI=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css" />
    <style>
      body { margin: 0; padding: 0;}
      #map {position: absolute; top: 0; bottom: 0; width: 100%;}
    </style>
  </head>
  <body>
    <style>
      body {
        overflow: hidden;
      }

      body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
      
      .datebefore {
        z-index: 9999;
        position: absolute;
        top: 5px;
        left: 0;
        padding: 5px;
        font-weight: bold;
        font-family: sans-serif;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 0.05em;
        text-shadow: 4px 4px rgba(0, 0, 0, 0.5);
      }
      
      .dateafter {
        z-index: 9999;
        position: absolute;
        top: 5px;
        right: 0;
        padding: 5px;
        font-weight: bold;
        font-family: sans-serif;
        font-size: 16px;
        color: #fff;
        letter-spacing: 0.05em;
        text-shadow: 4px 4px rgb(0 0 0 / 50%);
      }
      
      .select-container {
        position: absolute;
        top: 40px;
        z-index: 9999;
        left: 25px;
      }
      
      .select-container.right {
        left: auto;
        right: 20px;
      }
      
      .bg-white {
        background-color: white;
      }
      
      .px12 {
        padding-left: 12px;
        padding-right: 12px;
      }
      
      .select {
        padding: 8px 12px;
        font-size: 14px;
        font-family: sans-serif;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
</head>
<body>
    <div id="comparison-container">
        <div id="before" class="map"><div class="datebefore">Before</div></div>
        <div id="after" class="map"><div class="dateafter">After</div></div>
    </div>
<div class="select-container bg-white px12">
    <select id="selectLeft" class="select"></select>
    <div class="select-arrow"></div>
</div>
<div class="select-container bg-white px12 absolute right">
    <select id="selectRight" class="select"></select>
    <div class="select-arrow"></div>
</div>
    <script>
        const beforeMap = new maplibregl.Map({
            container: "before",
            style: {
                version: 8,
                sources: {},
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: { 'background-color': '#000000' }
                    }
                ]
            },
            center: [28.065, 1.33],
            zoom: 11.3,
            hash: true
        });

        const afterMap = new maplibregl.Map({
            container: "after",
            style: {
                version: 8,
                sources: {},
                layers: [
                    {
                        id: 'background',
                        type: 'background',
                        paint: { 'background-color': '#000000' }
                    }
                ]
            },
            center: [28.065, 1.33],
            zoom: 11.3,
            hash: true
        });

    const container = '#comparison-container';
    const map = new maplibregl.Compare(beforeMap, afterMap, container, {});
    const PERIODS = {
        // "Sentinel-2 2025": "2025",
        // "Sentinel-2 2024": "2024",
        // "Sentinel-2 2023": "2023",
        // "Sentinel-2 2022": "2022",
        // "Sentinel-2 2021": "2021",
        // "Sentinel-2 2020": "2020",
        // "Sentinel-2 2019": "2019",
        // "Sentinel-2 2018": "2018"
        "Sentinel-2 2018": "2018",
        "Sentinel-2 2019": "2019",
        "Sentinel-2 2020": "2020",
        "Sentinel-2 2021": "2021",
        "Sentinel-2 2022": "2022",
        "Sentinel-2 2023": "2023",
        "Sentinel-2 2024": "2024"
    };
    Object.keys(PERIODS).forEach((e, i) => {
        $("#selectLeft").append(new Option(e, PERIODS[e], PERIODS[e]==="2019", PERIODS[e]==="2019"));
        $("#selectRight").append(new Option(e, PERIODS[e], PERIODS[e]==="2024", PERIODS[e]==="2024"));

    });
    const mosaicLeft = $("#selectLeft option:selected").val();
    const mosaicRight = $("#selectRight option:selected").val();

    beforeMap.on("load", () => {
        const layers = beforeMap.getStyle().layers;
        let firstSymbolId;
        for (const layer of layers) {
            if (layer.id !== "background" && layer.id !== "satellite") {
                firstSymbolId = layer.id;
                break;
            }
        }

        beforeMap.addSource("s2cloudless-tiles-left", {
            "type": "raster",
            "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicLeft}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
            ],
            "tileSize": 256,
            "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
        });
        beforeMap.addLayer(
            {
                "id": "s2cloudless-layer-left",
                "type": "raster",
                "source": "s2cloudless-tiles-left"
            },
            firstSymbolId
        );
        $("#selectLeft").change(function() {
            // $("#select option:selected")
            beforeMap.removeLayer("s2cloudless-layer-left");
            beforeMap.removeSource("s2cloudless-tiles-left");
            const mosaicLeft = $("#selectLeft option:selected").val();
            beforeMap.addSource("s2cloudless-tiles-left", {
                "type": "raster",
                "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicLeft}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
                ],
                "tileSize": 256,
                "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
            });
            beforeMap.addLayer(
                {
                    "id": "s2cloudless-layer-left",
                    "type": "raster",
                    "source": "s2cloudless-tiles-left"
                },
                firstSymbolId
            );
        });
    });

    afterMap.on("load", () => {
        const layers = afterMap.getStyle().layers;
        let firstSymbolId;
        for (const layer of layers) {
            if (layer.id !== "background" && layer.id !== "satellite") {
                firstSymbolId = layer.id;
                break;
            }
        }

        afterMap.addSource("s2cloudless-tiles-right", {
            "type": "raster",
            "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicRight}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
            ],
            "tileSize": 256,
            "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH<br>(contains modified Copernicus Sentinel data)</a>'
        });
        afterMap.addLayer(
            {
                "id": "s2cloudless-layer-right",
                "type": "raster",
                "source": "s2cloudless-tiles-right"
            },
            firstSymbolId
        );
        $("#selectRight").change(function() {
            afterMap.removeLayer("s2cloudless-layer-right");
            afterMap.removeSource("s2cloudless-tiles-right");
            const mosaicRight = $("#selectRight option:selected").val();
            afterMap.addSource("s2cloudless-tiles-right", {
                "type": "raster",
                "tiles": [
                    `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicRight}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
                ],
                "tileSize": 256,
                "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH<br>(contains modified Copernicus Sentinel data)</a>'
            });
            afterMap.addLayer(
                {
                    "id": "s2cloudless-layer-right",
                    "type": "raster",
                    "source": "s2cloudless-tiles-right"
                },
                firstSymbolId
            );
        });
    });
</script>

</body>
</html>
