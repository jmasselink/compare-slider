<!DOCTYPE html>
<html>
<head>
    <title>Sentinel-2 Imagery Comparison</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-assembly/v1.3.0/assembly.min.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-assembly/v1.3.0/assembly.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js" integrity="sha256-u7e5khyithlIdTpu22PHhENmPcRdFiHRjhAuHcs05RI=" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
<style>
    body {
        overflow: hidden;
    }
     
    body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
     
    .map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
    }
    .datebefore {
        z-index: 9999;
        position: absolute;
        top: 20px;
        left: 0;
        padding: 25px;
        font-weight: bold;
        font-family: sans-serif;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 0.05em;
        text-shadow: 4px 4px rgba(0, 0, 0, 0.5);
    }
    .dateafter {
        z-index: 9999;
        position: absolute;
        top: 20px;
        right: 0;
        padding: 25px;
        font-weight: bold;
        font-family: sans-serif;
        font-size: 16px;
        color: #fff;
        letter-spacing: 0.05em;
        text-shadow: 4px 4px rgb(0 0 0 / 50%);
    }
</style>
<div id="comparison-container">
    <div id="before" class="map"><div class="datebefore">Before</div></div>
    <div id="after" class="map"><div class="dateafter">After</div></div>
</div>
<div class="select-container bg-white px12">
    <select id="selectLeft" class="select"></select>
    <div class="select-arrow"></div>
</div>
<div class="select-container bg-white px12 absolute right">
    <select id="selectRight" class="select"></select>
    <div class="select-arrow"></div>
</div>
<script>
    // YOUR TURN: Add your Mapbox access token
    mapboxgl.accessToken = "pk.eyJ1Ijoiam1hc3NlbGluayIsImEiOiJjbGU3eWllcmcwYTJnM29taG51dnV4NDhxIn0.fvnE_Pf3T6kKOt7TUeuubw";
    const beforeMap = new mapboxgl.Map({
        container: "before",
        style: "mapbox://styles/jmasselink/clgku1vu3001401nv5jg2jeqm",
    // YOUR TURN: Set the center coordinates and zoom level for the 'before' map on the left
        center: [28.065, 1.33],
        zoom: 11.3,
        hash: true
    });
    const afterMap = new mapboxgl.Map({
        container: "after",
        style: "mapbox://styles/jmasselink/clgku1vu3001401nv5jg2jeqm",
    // YOUR TURN: Set the center coordinates and zoom level for the 'before' map on the right
        center: [28.065, 1.33],//center: [28.25, 1.35],
        zoom: 11.3,
        hash: true
    });
    const container = '#comparison-container';
    const map = new mapboxgl.Compare(beforeMap, afterMap, container, {});
    const PERIODS = {
        "Sentinel-2 2024": "2024",
        "Sentinel-2 2023": "2023",
        "Sentinel-2 2022": "2022",
        "Sentinel-2 2021": "2021",
        "Sentinel-2 2020": "2020",
        "Sentinel-2 2019": "2019",
        "Sentinel-2 2018": "2018"
    };
    Object.keys(PERIODS).forEach((e, i) => {
        $("#selectLeft").append(new Option(e, PERIODS[e], i===1, i===1));
        $("#selectRight").append(new Option(e, PERIODS[e], i===0, i===0));

    });
    const mosaicLeft = $("#selectLeft option:selected").val();
    const mosaicRight = $("#selectRight option:selected").val();

    beforeMap.on("load", () => {
        const layers = beforeMap.getStyle().layers;
        let firstSymbolId;
        for (const layer of layers) {
            if (layer.id !== "background" && layer.id !== "satellite") {
                firstSymbolId = layer.id;
                break;
            }
        }

        beforeMap.addSource("s2cloudless-tiles-left", {
            "type": "raster",
            "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicLeft}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
            ],
            "tileSize": 256,
            "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
        });
        beforeMap.addLayer(
            {
                "id": "s2cloudless-layer-left",
                "type": "raster",
                "source": "s2cloudless-tiles-left"
            },
            firstSymbolId
        );
        $("#selectLeft").change(function() {
            // $("#select option:selected")
            beforeMap.removeLayer("s2cloudless-layer-left");
            beforeMap.removeSource("s2cloudless-tiles-left");
            const mosaicLeft = $("#selectLeft option:selected").val();
            beforeMap.addSource("s2cloudless-tiles-left", {
                "type": "raster",
                "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicLeft}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
                ],
                "tileSize": 256,
                "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
            });
            beforeMap.addLayer(
                {
                    "id": "s2cloudless-layer-left",
                    "type": "raster",
                    "source": "s2cloudless-tiles-left"
                },
                firstSymbolId
            );
        });
    });

    afterMap.on("load", () => {
        const layers = afterMap.getStyle().layers;
        let firstSymbolId;
        for (const layer of layers) {
            if (layer.id !== "background" && layer.id !== "satellite") {
                firstSymbolId = layer.id;
                break;
            }
        }

        afterMap.addSource("s2cloudless-tiles-right", {
            "type": "raster",
            "tiles": [
                `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicRight}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
            ],
            "tileSize": 256,
            "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
        });
        afterMap.addLayer(
            {
                "id": "s2cloudless-layer-right",
                "type": "raster",
                "source": "s2cloudless-tiles-right"
            },
            firstSymbolId
        );
        $("#selectRight").change(function() {
            afterMap.removeLayer("s2cloudless-layer-right");
            afterMap.removeSource("s2cloudless-tiles-right");
            const mosaicRight = $("#selectRight option:selected").val();
            afterMap.addSource("s2cloudless-tiles-right", {
                "type": "raster",
                "tiles": [
                    `https://tiles.maps.eox.at/wms?service=WMS&request=GetMap&version=1.3.0&layers=s2cloudless-${mosaicRight}_3857&styles=&format=image/png&crs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
                ],
                "tileSize": 256,
                "attribution": '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by <a href="https://eox.at">© EOX IT Services GmbH</a>'
            });
            afterMap.addLayer(
                {
                    "id": "s2cloudless-layer-right",
                    "type": "raster",
                    "source": "s2cloudless-tiles-right"
                },
                firstSymbolId
            );
        });
    });
</script>

</body>
</html>
